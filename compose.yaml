# Command Center. Copy .env.example to .env, fill it in, then:
#   docker compose up -d --build
# By default it listens on 127.0.0.1:3300. Put it behind your own reverse proxy
# (Caddy, nginx, Cloudflare Tunnel...) with HTTPS, or set BIND_IP to a private
# address such as your Tailscale IP.
services:
  command:
    build: .
    image: command-center
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-3300}:3000"
    environment:
      # Turns on the built-in password login. Leave empty only if your proxy already asks for a login.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # The key Claude threads send to /api/report. At least 32 characters.
      REPORT_TOKEN: ${REPORT_TOKEN:-}
      # Optional: a read-only GitHub token. You can also add tokens on the Board page.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: owner/repo,owner/repo always scanned for Claude PRs.
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      # Optional: the name shown for this machine in the Servers panel.
      SERVER_NAME: ${SERVER_NAME:-}
    volumes:
      # Everything you add (cards, mailboxes, tokens) lives here, mode 600.
      - command-data:/data

volumes:
  command-data:
