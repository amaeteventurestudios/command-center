<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Command Center is offline</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #f5f5f5; --muted: #a3a3a3; --accent: #7cc7ff; --line: #262626; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
  main { max-width: 26rem; display: grid; gap: 14px; justify-items: center; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  button { margin-top: 6px; height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: #000; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#111"/><circle cx="50" cy="50" r="30" fill="none" stroke="#7cc7ff" stroke-width="7"/><circle cx="50" cy="50" r="9" fill="#7cc7ff"/></svg>
  <h1>You're offline</h1>
  <p>The board needs a connection to your server. It will load again as soon as you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
